name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: compact stats card (header + activity + community + repositories)
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HabibaMahmoud2005
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Cairo

      # Card 2: languages-only card, with clear percentage breakdown
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HabibaMahmoud2005
          filename: github-languages.svg
          template: classic
          base: ""
          config_timezone: Africa/Cairo

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentages
